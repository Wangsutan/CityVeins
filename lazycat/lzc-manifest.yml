# CityVeins 懒猫 lpk 清单
# application = Web 界面 + Flask 接口（同一容器，容器内 :8000）
usage: >
  城脉 · 城市生活圈（15 分钟生活圈）评估平台。


  【使用前必须先配置高德地图 API Key】

  本应用不内置任何密钥，需要你自备一个高德「Web 服务」Key，否则查询住宅区与拉取 POI 都会失败：

  · 打开 https://console.amap.com/dev/key/app ，创建应用并添加 Key，
  服务平台请选择「Web 服务」（不是「Web 端 JS API」）。

  · 回到本应用，点右上角齿轮 ⚙️ 进入设置页，把 Key 粘到「高德地图 API Key」并保存。

  · 若该 Key 开启了 IP 白名单，需把本设备（懒猫微服）的出口公网 IP 加入白名单，
  否则查询会返回 INVALID_USER_IP。


  【基本流程】

  1. 在首页输入住宅区名称，点「选取地点」——这一步只是确定要分析的位置。

  2. 选定后点「保存到云端」——这一步才真正拉取周边 POI、按权重计算生活圈得分、
  并生成评估报告。它会按 POI 分类逐类发起周边搜索请求，通常需要几十秒，请耐心等待。

  3. 「AI 生成报告」为可选功能，需另配 DeepSeek API Key（设置页可填）。
  不填也能正常查询、拉 POI、算分与生成常规报告；填上后 AI 会把 POI 数据
  转成可读的分析结论，强烈推荐。

  4. 「下载到本地」可打包下载全部文件，也可逐个挑选；点旁边的「?」查看解压说明。


  【关于 POI 权重】

  设置页可查看与修改 900 余条 POI 类型的权重。两类权重作用不同：

  · 客制化权重：只影响评分，留空表示使用基础权重，是推荐的调整方式。

  · 基础权重：既影响评分，也影响抓取范围 —— 系统按「大类权重 ≥ 0.4」决定
  该大类下的 POI 是否被抓取，修改大类行会改变下次抓取收录哪些业态。


  【数据说明】

  受上述抓取范围限制，本应用当前覆盖大类权重 ≥ 0.4 的 10 个大类
  （医疗保健、科教文化、购物服务、交通设施、生活服务等）；餐饮服务、
  住宿服务等 14 个大类不在抓取范围内。因此报告中「未覆盖业态为 0」
  不代表现实中缺失，AI 报告会如实区分这两种情况。


  Before use, you must configure your own Amap (Gaode) "Web Service" API key:
  create one at https://console.amap.com/dev/key/app and paste it into the
  settings page (gear icon, top-right). If the key has an IP allowlist, add this
  device's public egress IP. An optional DeepSeek API key enables AI reports.

application:
  subdomain: cityveins
  image: embed:app-runtime
  routes:
    - /=exec://8000,/app/run.sh

  # 关闭平台的自动健康检查 —— 它在本应用上与真实可用性脱节。
  #
  # 实测证据（容器运行中逐项验证）：
  #   · 容器内直连 http://127.0.0.1:8000/           → 200，返回前端页面
  #   · 经 lzcinit 自身代理 http://127.0.0.1:80/     → 200，同一页面
  #   · 外部 https://cityveins.ljmc666.heiyu.space/ → 307 跳登录（网关转发正常）
  #   · 但 lzcinit 的 `-healthcheck` 子命令持续返回 1（连续 5 次全为 1）
  # 也就是说：应用与代理都正常，仅该健康探针自身报失败；容器过了
  # start_period 后就会被标成 unhealthy。先试过 test_url: / + start_period: 3m，
  # 未改善，故按 schema 的 disable 关闭。
  health_check:
    disable: true

  # 懒猫官方「文件选择器 / 下载拦截」：拦截应用内的原生文件入口
  # （<input type=file>、showOpenFilePicker / showSaveFilePicker，以及下载），
  # 让用户选择「本地文件系统 / 懒猫微服（网盘）」。
  #
  # 写法与 .88 上已过商店审核的标准项目 quotations 的 lazycat/lzc-manifest.yml
  # 对齐（id 命名 / diskRoot / text 双语标签 / hooks 全部给全）。
  # 应用端只需产出「anchor.download 存在且 href 以 blob: 开头」的下载锚点，
  # 拦截动作由注入脚本完成，见 content/lazycat-injects/lzc-file-chooser-inject.js。
  # 脚本随包分发，见 lzc-build.yml 的 contentdir 与 content/lazycat-injects/。
  injects:
    - id: lzc-file-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            locale: auto
            text:
              zh-CN:
                openTitle: 打开
                saveTitle: 保存
                openLocal: 从本地打开
                openLazyCat: 从懒猫微服打开
                saveLocal: 保存至本地
                saveLazyCat: 保存至懒猫微服
                cancel: 取消
              en-US:
                openTitle: Open
                saveTitle: Save
                openLocal: Open from local device
                openLazyCat: Open from LazyCat
                saveLocal: Save to local device
                saveLazyCat: Save to LazyCat
                cancel: Cancel
            hooks:
              fileSystemAccess: true
              fileInput: true

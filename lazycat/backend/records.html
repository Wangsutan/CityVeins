<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>记录袋 · 城脉</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);
    color:#333;line-height:1.65;min-height:100vh;padding:15px;
    -webkit-text-size-adjust:100%;
  }
  .container{max-width:1180px;margin:0 auto;background:#fff;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);overflow:hidden}

  header{background:linear-gradient(135deg,#466fa1 0%,#73bed3 100%);color:#fff;padding:20px 26px}
  header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{font-size:21px;font-weight:600}
  header p{font-size:13px;opacity:.92;margin-top:5px}
  header a.back{flex:0 0 auto;display:inline-block;background:rgba(255,255,255,.18);color:#fff;
    text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:8px;
    padding:9px 16px;font-size:14px;white-space:nowrap}
  header a.back:hover{background:rgba(255,255,255,.3)}

  .body{padding:22px 26px 30px}

  /* ---------- 统计 ---------- */
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .stat{flex:1 1 150px;border:1px solid #e3e8ef;border-radius:10px;padding:12px 16px;background:#fafcff}
  .stat .k{font-size:12.5px;color:#6b7785}
  .stat .v{font-size:20px;font-weight:700;color:#2c3e50;margin-top:2px;word-break:break-all}
  .stat .v.small{font-size:15px;font-weight:600}

  /* ---------- 工具条 ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .toolbar input[type=search]{
    flex:1 1 260px;min-width:0;padding:10px 13px;border:1px solid #d8e0ea;border-radius:8px;
    font-size:14px;font-family:inherit;
  }
  .toolbar label.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:#2c3e50;cursor:pointer}
  .toolbar button{
    padding:10px 16px;border:1px solid #d8e0ea;border-radius:8px;background:#fff;color:#2c3e50;
    font-size:14px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .toolbar button:hover{background:#f2f6fb}
  .toolbar button:disabled{opacity:.55;cursor:not-allowed}

  /* ---------- 记录卡片 ---------- */
  .list{display:flex;flex-direction:column;gap:14px}
  .rec{border:1px solid #e3e8ef;border-radius:12px;padding:16px 18px;background:#fff;
    transition:box-shadow .18s,border-color .18s}
  .rec:hover{box-shadow:0 6px 18px rgba(70,111,161,.12);border-color:#cfdcec}
  .rec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .rec-title{font-size:16.5px;font-weight:600;color:#2c3e50;word-break:break-all}
  .rec-sub{font-size:12.5px;color:#7a8694;margin-top:3px;word-break:break-all}
  .badges{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .badge{font-size:11.5px;padding:3px 9px;border-radius:20px;white-space:nowrap;
    background:#eef2f7;color:#54637a;border:1px solid #dde5ee}
  .badge.ai{background:#eaf6ec;color:#2f7d43;border-color:#cbe8d2}
  .badge.warn{background:#fff4e5;color:#8a5300;border-color:#ffd8a8}

  .metrics{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px}
  .metric .k{font-size:12px;color:#7a8694}
  .metric .v{font-size:15.5px;font-weight:600;color:#2c3e50}
  .metric .v.score{color:#2f7d43}

  .rec-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  .rec-actions button{
    padding:9px 15px;border:1px solid #d8e0ea;border-radius:8px;background:#fff;color:#2c3e50;
    font-size:13.5px;font-family:inherit;cursor:pointer;
  }
  .rec-actions button:hover{background:#f2f6fb}
  .rec-actions button:disabled{opacity:.5;cursor:not-allowed}
  .rec-actions button.primary{background:#466fa1;border-color:#466fa1;color:#fff}
  .rec-actions button.primary:hover{background:#3c608c}
  .rec-actions button.amber{background:#ff9a00;border-color:#ff9a00;color:#fff}
  .rec-actions button.amber:hover{background:#e88c00}
  .rec-actions button.danger{color:#b3261e;border-color:#f0c8c4}
  .rec-actions button.danger:hover{background:#fdf2f1}

  /* ---------- 文件清单 ---------- */
  .files{margin-top:14px;border-top:1px dashed #e3e8ef;padding-top:12px;display:none}
  .files.open{display:block}
  .file-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    flex-wrap:wrap;padding:8px 10px;border-radius:8px}
  .file-row:nth-child(odd){background:#fafcff}
  .file-name{font-size:13.5px;color:#2c3e50;font-weight:500}
  .file-meta{font-size:12px;color:#7a8694;margin-top:2px;word-break:break-all}
  .file-ops{display:flex;gap:7px;flex:0 0 auto}
  .file-ops button{padding:6px 12px;border:1px solid #d8e0ea;border-radius:7px;background:#fff;
    font-size:12.5px;font-family:inherit;cursor:pointer;color:#2c3e50}
  .file-ops button:hover{background:#eef3fa}

  .empty{text-align:center;color:#7a8694;padding:46px 16px;font-size:14.5px}
  .empty a{color:#466fa1}
  .err{background:#fdf2f1;border:1px solid #f0c8c4;color:#b3261e;border-radius:10px;
    padding:12px 16px;font-size:14px;margin-bottom:16px;display:none}
  .err.open{display:block}

  /* ---------- 弹层 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,28,40,.62);z-index:200;
    display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.open{display:flex}
  .sheet{background:#fff;border-radius:12px;width:100%;max-width:980px;height:88vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:13px 18px;background:linear-gradient(135deg,#466fa1 0%,#73bed3 100%);color:#fff}
  .sheet-head .t{font-size:15px;font-weight:600;word-break:break-all}
  .sheet-head .ops{display:flex;gap:8px;flex:0 0 auto}
  .sheet-head button{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);
    border-radius:8px;padding:7px 13px;font-size:13.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .sheet-head button:hover{background:rgba(255,255,255,.34)}
  .sheet-body{flex:1;min-height:0;background:#f6f8fb}
  .sheet-body iframe{width:100%;height:100%;border:0;background:#fff;display:block}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:#2c3e50;color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;
    z-index:300;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  .toast.show{opacity:1}

  @media (max-width:640px){
    body{padding:10px}
    .body{padding:16px 14px 24px}
    header{padding:16px 16px}
    header h1{font-size:19px}
    .rec{padding:14px}
    .metrics{gap:14px}
    .rec-actions button{flex:1 1 44%}
    .sheet{height:92vh}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="row">
      <div>
        <h1>记录袋</h1>
        <p>存在云端（懒猫微服）的全部已形成数据 · 可预览报告、按条下载</p>
      </div>
      <a class="back" href="/">← 返回城脉首页</a>
    </div>
  </header>

  <div class="body">
    <div id="err" class="err"></div>

    <div class="stats">
      <div class="stat"><div class="k">已保存记录</div><div class="v" id="s-count">—</div></div>
      <div class="stat"><div class="k">其中含 AI 报告</div><div class="v" id="s-ai">—</div></div>
      <div class="stat"><div class="k">占用空间</div><div class="v small" id="s-size">—</div></div>
      <div class="stat"><div class="k">最近一次保存</div><div class="v small" id="s-last">—</div></div>
    </div>

    <div class="toolbar">
      <input id="q" type="search" placeholder="按住宅区名称或 ID 搜索（如 恒大御府 / L430722）"/>
      <label class="chk"><input id="only-ai" type="checkbox"/> 只看含 AI 报告</label>
      <button id="reload" type="button">刷新</button>
    </div>

    <div id="list" class="list"></div>
  </div>
</div>

<div id="preview-overlay" class="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <span class="t" id="preview-title">报告预览</span>
      <span class="ops">
        <button type="button" id="preview-download">下载这份报告</button>
        <button type="button" id="preview-close">关闭</button>
      </span>
    </div>
    <div class="sheet-body"><iframe id="preview-frame" title="报告预览"></iframe></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const API = '';                 // 同源
  let RECORDS = [];
  let previewCtx = null;          // 当前预览的 {url, downloadUrl, name}

  const $ = function (id) { return document.getElementById(id); };

  function toast(msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, ms || 2200);
  }

  function showErr(msg) {
    const el = $('err');
    el.textContent = msg;
    el.classList.add('open');
  }

  function clearErr() { $('err').classList.remove('open'); }

  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return '—';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0, v = Number(bytes);
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
    return (i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)) + ' ' + units[i];
  }

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtScore(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n.toFixed(2) + ' 分' : '—';
  }

  // ---------- 懒猫拦截器要求：blob: + download 属性 ----------
  async function fetchBlob(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.blob();
  }

  async function triggerDownload(url, filename) {
    toast('正在取回文件…', 60000);
    try {
      const blob = await fetchBlob(url);
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename || 'download';
      a.style.display = 'none';
      document.body.appendChild(a);
      try {
        a.click();
        toast('已发起下载：' + a.download);
      } finally {
        document.body.removeChild(a);
        setTimeout(function () { try { URL.revokeObjectURL(blobUrl); } catch (e) {} }, 60000);
      }
    } catch (e) {
      toast('下载失败：' + (e && e.message ? e.message : e), 4000);
    }
  }

  // ---------- 渲染 ----------
  function filtered() {
    const q = $('q').value.trim().toLowerCase();
    const onlyAi = $('only-ai').checked;
    return RECORDS.filter(function (r) {
      if (onlyAi && !r.has_ai_report) return false;
      if (!q) return true;
      return (String(r.name).toLowerCase().indexOf(q) >= 0) ||
             (String(r.rid).toLowerCase().indexOf(q) >= 0) ||
             (String(r.dir).toLowerCase().indexOf(q) >= 0);
    });
  }

  function renderStats() {
    $('s-count').textContent = RECORDS.length;
    $('s-ai').textContent = RECORDS.filter(function (r) { return r.has_ai_report; }).length;
    const total = RECORDS.reduce(function (a, r) { return a + (r.total_bytes || 0); }, 0);
    $('s-size').textContent = fmtSize(total);
    $('s-last').textContent = RECORDS.length ? RECORDS[0].created : '—';
  }

  function renderList() {
    const box = $('list');
    const rows = filtered();

    if (!RECORDS.length) {
      box.innerHTML = '<div class="empty">云端还没有已保存的数据。<br>' +
        '到<a href="/">首页</a>查询住宅区并点「保存到云端」后，这里就会出现记录。</div>';
      return;
    }
    if (!rows.length) {
      box.innerHTML = '<div class="empty">没有匹配的记录，换个关键词试试。</div>';
      return;
    }

    box.innerHTML = rows.map(function (r, i) {
      const badges = [];
      if (r.has_ai_report) badges.push('<span class="badge ai">含 AI 报告</span>');
      if (!r.has_report) badges.push('<span class="badge warn">报告缺失</span>');
      if (r.incomplete) badges.push('<span class="badge warn">可能未写完</span>');
      badges.push('<span class="badge">' + esc(r.file_count) + ' 个文件</span>');
      badges.push('<span class="badge">' + esc(fmtSize(r.total_bytes)) + '</span>');

      // 按钮文案随实际状态切换：
      //   已有报告 → 「预览…」（点了就看）
      //   没有报告 → 「生成…」（点了真去生成，成功后自动预览）
      // 数据不足以生成时置灰并说明缺什么。
      const canReport = r.can_generate_report !== false;
      const canAi = r.can_generate_ai_report !== false;
      const reportBtn = r.has_report
        ? '<button type="button" class="primary" data-act="preview" ' +
          (r.report_preview_url ? '' : 'disabled') + '>预览评估报告</button>'
        : '<button type="button" class="primary" data-act="gen-report" ' +
          (canReport ? '' : 'disabled title="缺少生成所需的数据"') + '>生成评估报告</button>';
      const aiBtn = r.has_ai_report
        ? '<button type="button" class="amber" data-act="preview-ai" ' +
          (r.ai_report_preview_url ? '' : 'disabled') + '>预览 AI 报告</button>'
        : '<button type="button" class="amber" data-act="gen-ai" ' +
          (canAi ? '' : 'disabled title="缺少生成所需的数据"') + '>生成 AI 报告</button>';

      if (!r.has_report && !canReport) {
        badges.push('<span class="badge warn">无法生成报告</span>');
      }

      return '' +
      '<div class="rec" data-idx="' + i + '">' +
        '<div class="rec-head">' +
          '<div>' +
            '<div class="rec-title">' + esc(r.name || r.rid) + '</div>' +
            '<div class="rec-sub">ID ' + esc(r.rid) + ' · 保存于 ' + esc(r.created) + '</div>' +
          '</div>' +
          '<div class="badges">' + badges.join('') + '</div>' +
        '</div>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="k">加权总分</div><div class="v score">' + esc(fmtScore(r.total_score)) + '</div></div>' +
          '<div class="metric"><div class="k">POI 总数</div><div class="v">' + esc(r.poi_count === null || r.poi_count === undefined ? '—' : r.poi_count + ' 个') + '</div></div>' +
          '<div class="metric"><div class="k">覆盖大类 / 中类</div><div class="v">' +
            esc((r.big_category_count === null || r.big_category_count === undefined ? '—' : r.big_category_count) + ' / ' +
                (r.mid_category_count === null || r.mid_category_count === undefined ? '—' : r.mid_category_count)) + '</div></div>' +
        '</div>' +
        '<div class="rec-actions">' +
          reportBtn +
          aiBtn +
          '<button type="button" data-act="files">文件清单</button>' +
          '<button type="button" data-act="zip">下载全部（ZIP）</button>' +
          '<button type="button" class="danger" data-act="delete">删除</button>' +
        '</div>' +
        '<div class="files" id="files-' + i + '"></div>' +
      '</div>';
    }).join('');
  }

  async function toggleFiles(idx, rid, ts) {
    const box = $('files-' + idx);
    if (!box) return;
    if (box.classList.contains('open')) { box.classList.remove('open'); return; }

    box.classList.add('open');
    box.innerHTML = '<div class="file-meta" style="padding:6px 10px;">正在读取文件清单…</div>';
    try {
      const res = await fetch(API + '/api/records/' + encodeURIComponent(rid) + '/' + ts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      if (!data.files || !data.files.length) {
        box.innerHTML = '<div class="file-meta" style="padding:6px 10px;">这个记录目录是空的。</div>';
        return;
      }
      box.innerHTML = data.files.map(function (f) {
        const canPreview = (f.ext === '.html' || f.ext === '.md' || f.ext === '.json' || f.ext === '.csv');
        return '<div class="file-row">' +
          '<div>' +
            '<div class="file-name">' + esc(f.display_name) + '</div>' +
            '<div class="file-meta">' + esc(f.name) + ' · ' + fmtSize(f.size_bytes) + ' · ' + esc(f.mtime) + '</div>' +
          '</div>' +
          '<div class="file-ops">' +
            (canPreview ? '<button type="button" data-fprev="' + esc(f.preview_url) + '" data-fname="' + esc(f.name) + '">预览</button>' : '') +
            '<button type="button" data-fdl="' + esc(f.download_url) + '" data-fname="' + esc(f.name) + '">下载</button>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (e) {
      box.innerHTML = '<div class="file-meta" style="padding:6px 10px;color:#b3261e;">读取失败：' + esc(e.message) + '</div>';
    }
  }

  // ---------- 预览：站内弹层，不用 window.open ----------
  // 与首页同理：安卓上开新窗口/外部浏览器会把当前页面顶掉，
  // 所以预览一律在同一页面里用 iframe 打开。
  function openPreview(url, title, downloadUrl) {
    previewCtx = { url: url, downloadUrl: downloadUrl, name: title };
    $('preview-title').textContent = title;
    $('preview-frame').src = url;
    $('preview-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePreview() {
    $('preview-overlay').classList.remove('open');
    $('preview-frame').src = 'about:blank';   // 停掉里面的请求
    document.body.style.overflow = '';
    previewCtx = null;
  }

  // ---------- 生成报告 ----------
  // 后端接口：
  //   POST /api/records/<rid>/<ts>/generate-report   重建评估报告（不联网、不重拉 POI）
  //   POST /ai-report                                生成 AI 报告（走 DeepSeek，较慢）
  function setBtnBusy(btn, busy, busyText) {
    if (!btn) return;
    if (busy) {
      btn.dataset.label = btn.textContent;
      btn.textContent = busyText || '处理中…';
      btn.disabled = true;
    } else if (btn.dataset.label) {
      btn.textContent = btn.dataset.label;
      btn.disabled = false;
    }
  }

  async function postJson(url, payload) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8',
                 'Accept': 'application/json; charset=utf-8' },
      body: JSON.stringify(payload || {})
    });
    let data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function generateReport(r, btn) {
    setBtnBusy(btn, true, '正在生成…');
    toast('正在生成评估报告（不重新拉取 POI）…', 60000);
    try {
      const data = await postJson(
        API + '/api/records/' + encodeURIComponent(r.rid) + '/' + r.ts + '/generate-report', {});
      toast('评估报告已生成' + (data.html_ok === false ? '（HTML 转换失败，Markdown 已保存）' : ''));
      await load(false);
      const fresh = RECORDS.find(function (x) { return x.dir === r.dir; });
      if (fresh && fresh.report_preview_url) {
        openPreview(fresh.report_preview_url,
                    (fresh.name || fresh.rid) + ' · 评估报告',
                    fresh.report_preview_url.replace('/preview/', '/download/'));
      }
    } catch (e) {
      toast('生成失败：' + (e && e.message ? e.message : e), 5000);
      setBtnBusy(btn, false);
    }
  }

  // AI 报告：默认提示词从后端拿（与首页那份是同一个来源，避免两边各写一份）
  let aiPromptCache = null;

  async function defaultAiPrompt() {
    if (aiPromptCache) return aiPromptCache;
    try {
      const res = await fetch(API + '/api/records/default-ai-prompt');
      const d = await res.json();
      aiPromptCache = d.prompt || '';
    } catch (e) {
      aiPromptCache = '';
    }
    return aiPromptCache;
  }

  async function askAiPrompt(r) {
    const existing = document.getElementById('ai-prompt-modal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'ai-prompt-modal';
    modal.className = 'overlay open';
    modal.innerHTML =
      '<div class="sheet" style="height:auto;max-width:760px;">' +
        '<div class="sheet-head">' +
          '<span class="t">生成 AI 报告 · ' + esc(r.name || r.rid) + '</span>' +
          '<span class="ops">' +
            '<button type="button" data-pm="cancel">取消</button>' +
          '</span>' +
        '</div>' +
        '<div style="padding:16px 18px;overflow:auto;">' +
          '<div class="records-entry-hint" style="margin:0 0 9px;">' +
            '将读取该记录已保存的 POI 与统计结果交给 DeepSeek 分析，' +
            '不会重新拉取高德数据。生成通常需要十几秒到一分钟。' +
          '</div>' +
          '<textarea id="ai-prompt-text" style="width:100%;height:260px;padding:11px 13px;' +
            'border:1px solid #d8e0ea;border-radius:8px;font-size:13.5px;' +
            'font-family:inherit;line-height:1.6;resize:vertical;"></textarea>' +
          '<div style="display:flex;gap:9px;margin-top:12px;">' +
            '<button type="button" class="primary" data-pm="go" style="padding:10px 18px;' +
              'border:1px solid #466fa1;border-radius:8px;background:#466fa1;color:#fff;' +
              'font-size:14px;font-family:inherit;cursor:pointer;">' +
              '开始生成</button>' +
            '<button type="button" data-pm="cancel" style="padding:10px 18px;' +
              'border:1px solid #d8e0ea;border-radius:8px;background:#fff;' +
              'font-size:14px;font-family:inherit;cursor:pointer;">取消</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);

    const ta = document.getElementById('ai-prompt-text');
    ta.value = await defaultAiPrompt();

    modal.addEventListener('click', async function (ev) {
      const btn = ev.target.closest ? ev.target.closest('[data-pm]') : null;
      const act = btn ? btn.dataset.pm : (ev.target === modal ? 'cancel' : null);
      if (!act) return;
      if (act === 'cancel') { modal.remove(); return; }
      const prompt = ta.value.trim();
      if (!prompt) { toast('提示词不能为空'); return; }
      modal.remove();
      await generateAiReport(r, prompt);
    });
  }

  async function generateAiReport(r, prompt) {
    toast('正在生成 AI 报告，请稍候…', 120000);
    try {
      const data = await postJson(API + '/ai-report', {
        residential_id: r.rid,
        save_dir: r.dir,
        prompt: prompt
      });
      toast('AI 报告已生成' + (data.html_ok === false ? '（HTML 转换失败，Markdown 已保存）' : ''));
      await load(false);
      const fresh = RECORDS.find(function (x) { return x.dir === r.dir; });
      if (fresh && fresh.ai_report_preview_url) {
        openPreview(fresh.ai_report_preview_url,
                    (fresh.name || fresh.rid) + ' · AI 分析报告',
                    fresh.ai_report_preview_url.replace('/preview/', '/download/'));
      }
    } catch (e) {
      toast('生成失败：' + (e && e.message ? e.message : e), 6000);
    }
  }

  // ---------- 删除 ----------
  async function deleteRecord(rid, ts, name) {
    if (!confirm('确定删除「' + name + '」这条云端记录吗？\n目录 ' + rid + '_' + ts + ' 会被永久删除，无法恢复。')) {
      return;
    }
    try {
      const res = await fetch(API + '/api/records/' + encodeURIComponent(rid) + '/' + ts +
                              '/delete?confirm=1', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      toast('已删除：' + name);
      await load(true);
    } catch (e) {
      toast('删除失败：' + (e && e.message ? e.message : e), 4000);
    }
  }

  // ---------- 事件 ----------
  $('list').addEventListener('click', function (ev) {
    const btn = ev.target.closest ? ev.target.closest('button') : null;
    if (!btn) return;

    // 文件清单里的「预览 / 下载」
    if (btn.dataset.fprev) {
      openPreview(btn.dataset.fprev, btn.dataset.fname, btn.dataset.fprev.replace('/preview/', '/download/'));
      return;
    }
    if (btn.dataset.fdl) {
      triggerDownload(btn.dataset.fdl, btn.dataset.fname);
      return;
    }

    const act = btn.dataset.act;
    if (!act) return;
    const card = btn.closest('.rec');
    const idx = parseInt(card.dataset.idx, 10);
    const r = filtered()[idx];
    if (!r) return;

    if (act === 'preview') {
      openPreview(r.report_preview_url, (r.name || r.rid) + ' · 评估报告', r.report_preview_url.replace('/preview/', '/download/'));
    } else if (act === 'preview-ai') {
      openPreview(r.ai_report_preview_url, (r.name || r.rid) + ' · AI 分析报告', r.ai_report_preview_url.replace('/preview/', '/download/'));
    } else if (act === 'gen-report') {
      generateReport(r, btn);
    } else if (act === 'gen-ai') {
      askAiPrompt(r);
    } else if (act === 'files') {
      toggleFiles(idx, r.rid, r.ts);
    } else if (act === 'zip') {
      triggerDownload(API + r.zip_url, r.dir + '.zip');
    } else if (act === 'delete') {
      deleteRecord(r.rid, r.ts, r.name || r.rid);
    }
  });

  $('preview-close').addEventListener('click', closePreview);
  $('preview-download').addEventListener('click', function () {
    if (previewCtx) triggerDownload(previewCtx.downloadUrl, previewCtx.name.replace(/[·\s]+/g, '_') + '.html');
  });
  $('preview-overlay').addEventListener('click', function (ev) {
    if (ev.target === $('preview-overlay')) closePreview();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closePreview();
  });

  $('q').addEventListener('input', renderList);
  $('only-ai').addEventListener('change', renderList);
  $('reload').addEventListener('click', function () { load(true); });

  // ---------- 加载 ----------
  async function load(manual) {
    if (manual) toast('正在刷新…', 900);
    clearErr();
    $('list').innerHTML = '<div class="empty">正在读取云端记录…</div>';
    try {
      const res = await fetch(API + '/api/records', { headers: { 'Accept': 'application/json' } });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      RECORDS = data.records || [];
      renderStats();
      renderList();
      if (manual) toast('已刷新，共 ' + RECORDS.length + ' 条记录');
    } catch (e) {
      RECORDS = [];
      renderStats();
      $('list').innerHTML = '';
      showErr('读取云端记录失败：' + (e && e.message ? e.message : e));
    }
  }

  load(false);
</script>
</body>
</html>

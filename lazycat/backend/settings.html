<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>设置 · 城脉</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
    background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);
    color:#333;line-height:1.65;min-height:100vh;padding:15px;
    -webkit-text-size-adjust:100%;
  }
  .container{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);overflow:hidden}
  header{background:linear-gradient(135deg,#466fa1 0%,#73bed3 100%);color:#fff;padding:20px 26px}
  header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  header h1{font-size:21px;font-weight:600}
  header p{font-size:13px;opacity:.92;margin-top:5px}
  header a.back{flex:0 0 auto;display:inline-block;background:rgba(255,255,255,.18);color:#fff;
    text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:8px;
    padding:9px 16px;font-size:14px;white-space:nowrap}
  header a.back:hover{background:rgba(255,255,255,.3)}
  .body{padding:22px 26px 30px}

  .intro{font-size:13.5px;color:#5c6672;margin-bottom:18px;line-height:1.8}

  .items{display:flex;flex-direction:column;gap:12px}

  /* 每个设置项就是一整块可点区域 —— 点进去才是那个项目自己的设置页 */
  a.item{
    display:flex;align-items:center;gap:14px;
    border:1px solid #e3e8ef;border-radius:12px;padding:16px 18px;
    text-decoration:none;color:inherit;background:#fff;
    transition:box-shadow .18s,border-color .18s,transform .18s;
  }
  a.item:hover{box-shadow:0 6px 18px rgba(70,111,161,.14);border-color:#cfdcec;transform:translateY(-1px)}
  .item .icon{
    flex:0 0 auto;width:42px;height:42px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;background:#eef2f7;
  }
  .item.amap .icon{background:#fff1e0}
  .item.ds .icon{background:#e9f2ff}
  .item.weights .icon{background:#eaf6ec}
  .item .main{flex:1 1 auto;min-width:0}
  .item .title{font-size:15.5px;font-weight:600;color:#2c3e50;display:flex;align-items:center;
    gap:8px;flex-wrap:wrap}
  .item .desc{font-size:12.5px;color:#7a8694;margin-top:3px;display:block}
  .item .state{font-size:12px;color:#7a8694;margin-top:6px;display:block}
  .item .state .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#c9d2dd;margin-right:5px;vertical-align:middle}
  .item .state .dot.ok{background:#3ba55d}
  .item .state .dot.no{background:#e0742f}
  .item .arrow{flex:0 0 auto;color:#b8c4d4;font-size:20px;line-height:1}

  .tag{font-size:11.5px;padding:2px 9px;border-radius:20px;white-space:nowrap;
    background:#eef2f7;color:#54637a;border:1px solid #dde5ee;font-weight:400}
  .tag.required{background:#fff1e0;color:#95561a;border-color:#ffd8a8}
  .tag.optional{background:#eaf6ec;color:#2f7d43;border-color:#cbe8d2}

  @media (max-width:480px){
    body{padding:10px}
    .body{padding:16px 14px 24px}
    header{padding:16px 16px}
    header h1{font-size:19px}
    a.item{padding:14px;gap:11px}
    .item .icon{width:36px;height:36px;font-size:17px}
    .item .title{font-size:14.5px}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="row">
      <div>
        <h1>设置</h1>
        <p>每一项都有自己的页面，点进去单独设置</p>
      </div>
      <a class="back" href="/">← 返回城脉首页</a>
    </div>
  </header>

  <div class="body">
    <p class="intro">
      所有设置项都收在这里，不会出现在主界面的功能按钮里。
      点任意一项进入它自己的页面；改动即时保存，容器重建也不会丢。
    </p>

    <div class="items">
      <a class="item amap" href="/settings/amap">
        <span class="icon">🗺️</span>
        <span class="main">
          <span class="title">高德 API Key <span class="tag required">必填</span></span>
          <span class="desc">住宅区查询 / POI 拉取 / 评分与报告</span>
          <span class="state" id="state-amap"><span class="dot"></span>读取中…</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="item ds" href="/settings/deepseek">
        <span class="icon">🤖</span>
        <span class="main">
          <span class="title">DeepSeek API Key <span class="tag optional">可选 · 强烈推荐</span></span>
          <span class="desc">仅「AI生成报告」使用</span>
          <span class="state" id="state-ds"><span class="dot"></span>读取中…</span>
        </span>
        <span class="arrow">›</span>
      </a>

      <a class="item weights" href="/weights">
        <span class="icon">⚖️</span>
        <span class="main">
          <span class="title">POI 权重 <span class="tag">抓取范围 + 评分</span></span>
          <span class="desc">决定拉取哪些业态、各类在评分里占多少</span>
          <span class="state" id="state-weights"><span class="dot"></span>读取中…</span>
        </span>
        <span class="arrow">›</span>
      </a>
    </div>

  </div>
</div>

<script>
const API = '';

function $(id){ return document.getElementById(id); }

function setState(id, ok, text){
  const el = $(id);
  if (!el) return;
  el.innerHTML = '<span class="dot ' + (ok ? 'ok' : 'no') + '"></span>' + text;
}

/* 列表页只显示各设置项的现状摘要，真正的设置在各自页面里 —— 所以这里只读不写 */
async function loadSummary(){
  try {
    const a = await fetch(API + '/api/settings/amap-key').then(r => r.json());
    setState('state-amap', !!a.configured,
             a.configured ? ('已配置 · ' + a.length + ' 位') : '未配置 —— 不填无法查询');
  } catch (e) {
    setState('state-amap', false, '状态读取失败');
  }

  try {
    const d = await fetch(API + '/api/settings/deepseek-key').then(r => r.json());
    setState('state-ds', !!d.configured,
             d.configured ? ('已配置 · ' + d.length + ' 位') : '未配置（可选）—— 仅 AI 报告不可用');
  } catch (e) {
    setState('state-ds', false, '状态读取失败');
  }

  try {
    const w = await fetch(API + '/api/weights').then(r => r.json());
    if (w.error) throw new Error(w.error);
    const s = w.stats || {};
    setState('state-weights', true,
             '共 ' + (s.total || 0) + ' 条 · 已客制化 ' + (s.customized || 0) +
             ' 项 · ' + (s.bigcats || 0) + ' 个大类');
  } catch (e) {
    setState('state-weights', false, '权重表读取失败');
  }
}

loadSummary();
</script>
</body>
</html>

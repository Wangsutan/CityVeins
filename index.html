<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>城脉 - 城市生活圈分析平台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        line-height: 1.6;
        min-height: 100vh;
        padding: 20px;
      }
      
      .container {
        max-width: 900px;
        margin: 0 auto;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      
      header {
        background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        color: white;
        padding: 40px 30px;
        text-align: center;
      }
      
      h1 {
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 15px;
        letter-spacing: 2px;
      }
      
      .slogan {
        font-size: 1.3rem;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.8;
      }
      
      .slogan-highlight {
        position: relative;
        display: inline-block;
        font-weight: bold;
      }
      
      .slogan-highlight.dudian::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #e74c3c, #f39c12);
        border-radius: 2px;
        transform: scaleX(0.9);
      }
      
      .slogan-highlight.qimai::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #2ecc71, #3498db);
        border-radius: 2px;
        transform: scaleX(0.9);
      }
      
      .main-content {
        padding: 40px 30px;
      }
      
      .search-section {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 30px;
        border-bottom: 1px solid #eee;
      }
      
      .search-title {
        font-size: 1.4rem;
        margin-bottom: 20px;
        color: #2c3e50;
      }
      
      .search-box {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
      }
      
      #name {
        padding: 12px 20px;
        font-size: 1.1rem;
        border: 2px solid #ddd;
        border-radius: 8px 0 0 8px;
        width: 70%;
        max-width: 400px;
        transition: all 0.3s;
      }
      
      #name:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }
      
      #query-btn {
        padding: 12px 25px;
        font-size: 1.1rem;
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        color: white;
        border: none;
        border-radius: 0 8px 8px 0;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      #query-btn:hover {
        background: linear-gradient(135deg, #2980b9 0%, #2471a3 100%);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      
      .action-section {
        text-align: center;
        margin-bottom: 30px;
      }
      
      .action-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
      }
      
      .action-btn {
        padding: 14px 25px;
        font-size: 1.1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        min-width: 160px;
      }
      
      .save-btn {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: white;
      }
      
      .download-btn {
        background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        color: white;
      }
      
      .action-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }
      
      .action-btn:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      
      .download-options {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #e9ecef;
      }
      
      .download-options h4 {
        margin-bottom: 15px;
        color: #2c3e50;
        text-align: center;
      }
      
      .platform-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 15px;
      }
      
      .platform-btn {
        padding: 10px 20px;
        border: 2px solid #3498db;
        background: white;
        color: #3498db;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .platform-btn.active {
        background: #3498db;
        color: white;
      }
      
      .platform-btn:hover {
        background: #3498db;
        color: white;
      }
      
      .download-instructions {
        background: white;
        padding: 15px;
        border-radius: 6px;
        border-left: 4px solid #3498db;
        margin-top: 15px;
        font-size: 0.9rem;
      }
      
      .results-section {
        margin-top: 30px;
      }
      
      #log {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        min-height: 200px;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        font-family: monospace;
        line-height: 1.5;
      }
      
      .picker {
        background: #fff;
        border: 2px solid #3498db;
        border-radius: 12px;
        padding: 25px;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      
      .picker h3 {
        margin-bottom: 20px;
        color: #2c3e50;
        text-align: center;
      }
      
      .picker label {
        display: block;
        padding: 12px 15px;
        margin-bottom: 8px;
        border-radius: 6px;
        transition: background 0.2s;
        cursor: pointer;
      }
      
      .picker label:hover {
        background: #f1f8ff;
      }
      
      .picker input[type="radio"] {
        margin-right: 10px;
      }
      
      .picker-buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }
      
      .picker-btn {
        padding: 10px 25px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: all 0.3s;
      }
      
      .confirm-btn {
        background: #3498db;
        color: white;
      }
      
      .cancel-btn {
        background: #e74c3c;
        color: white;
      }
      
      .picker-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      
      footer {
        text-align: center;
        padding: 20px;
        color: #7f8c8d;
        font-size: 0.9rem;
        border-top: 1px solid #eee;
      }
      
      @media (max-width: 600px) {
        h1 {
          font-size: 2.5rem;
        }
        
        .slogan {
          font-size: 1.1rem;
        }
        
        .search-box {
          flex-direction: column;
          align-items: center;
        }
        
        #name {
          width: 100%;
          border-radius: 8px;
          margin-bottom: 10px;
        }
        
        #query-btn {
          width: 100%;
          border-radius: 8px;
        }
        
        .action-buttons {
          flex-direction: column;
          align-items: center;
        }
        
        .action-btn {
          width: 100%;
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>城脉</h1>
        <p class="slogan">打通城市一刻钟便民生活圈<span class="slogan-highlight dudian">堵点</span>，畅通城市居民生活<span class="slogan-highlight qimai">气脉</span>。</p>
      </header>
      
      <div class="main-content">
        <section class="search-section">
          <h2 class="search-title">查询住宅区信息</h2>
          <div class="search-box">
            <input id="name" type="text" placeholder="输入住宅区名称" />
            <button id="query-btn" onclick="queryName()">查询</button>
          </div>
        </section>
        
        <section class="action-section">
          <div class="action-buttons">
            <button id="save-btn" class="action-btn save-btn" onclick="saveData()" disabled>保存到云端</button>
            <button id="download-btn" class="action-btn download-btn" onclick="showDownloadOptions()" disabled>下载到本地</button>
          </div>
          
          <div id="download-options" class="download-options" style="display: none;">
            <h4>选择下载方式</h4>
            <div class="platform-buttons">
              <button class="platform-btn active" onclick="selectPlatform('windows')">Windows</button>
              <button class="platform-btn" onclick="selectPlatform('linux')">Linux/Mac</button>
              <button class="platform-btn" onclick="selectPlatform('android')">Android</button>
              <button class="platform-btn" onclick="selectPlatform('browser')">浏览器下载</button>
            </div>
            
            <div id="download-instructions" class="download-instructions">
              <strong>Windows 下载说明：</strong><br>
              1. 右键点击下面的下载链接<br>
              2. 选择"另存为"<br>
              3. 选择保存位置（如：桌面、文档等）<br>
              4. 点击保存即可下载到本地
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
              <button class="action-btn save-btn" onclick="downloadFiles()">开始下载</button>
              <button class="action-btn" onclick="hideDownloadOptions()" style="background: #95a5a6; margin-left: 10px;">取消</button>
            </div>
          </div>
        </section>
        
        <section class="results-section">
          <h3 style="margin-bottom: 15px; color: #2c3e50;">查询结果</h3>
          <pre id="log">请输入住宅区名称并点击查询按钮...</pre>
        </section>
      </div>
      
      <footer>
        <p>城脉 · 城市生活圈分析平台 © 2025</p>
      </footer>
    </div>

    <script>
      const API = 'http://47.112.146.115';
      let lastResult = null;
      let candidates = [];
      let currentSaveDir = '';
      let selectedPlatform = 'windows';

      // 更新按钮状态
      function updateButtonStates() {
        const saveBtn = document.getElementById('save-btn');
        const downloadBtn = document.getElementById('download-btn');
        const hasResult = lastResult && lastResult.result;
        
        saveBtn.disabled = !hasResult;
        downloadBtn.disabled = !currentSaveDir;
      }

      // 选择平台
      function selectPlatform(platform) {
        selectedPlatform = platform;
        
        // 更新按钮状态
        document.querySelectorAll('.platform-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // 更新说明文字
        const instructions = document.getElementById('download-instructions');
        switch(platform) {
          case 'windows':
            instructions.innerHTML = `
              <strong>Windows 下载说明：</strong><br>
              1. 点击"开始下载"按钮<br>
              2. 浏览器会自动下载ZIP压缩包<br>
              3. 解压到任意文件夹即可查看报告<br>
              4. 或者右键链接选择"另存为"
            `;
            break;
          case 'linux':
            instructions.innerHTML = `
              <strong>Linux/Mac 下载说明：</strong><br>
              1. 点击"开始下载"获取ZIP文件<br>
              2. 使用命令解压: <code>unzip 文件名.zip</code><br>
              3. 或在桌面环境中双击解压<br>
              4. 使用浏览器打开HTML报告文件
            `;
            break;
          case 'android':
            instructions.innerHTML = `
              <strong>Android 下载说明：</strong><br>
              1. 点击"开始下载"按钮<br>
              2. 使用文件管理器应用打开下载目录<br>
              3. 安装ZArchiver等解压软件<br>
              4. 解压后使用浏览器打开HTML文件
            `;
            break;
          case 'browser':
            instructions.innerHTML = `
              <strong>浏览器直接下载：</strong><br>
              1. 点击下方文件链接直接下载<br>
              2. 支持单个文件下载<br>
              3. 右键链接可选择"另存为"<br>
              4. 推荐下载HTML报告文件查看
            `;
            break;
        }
      }

      // 显示下载选项
      function showDownloadOptions() {
        if (!currentSaveDir) {
          alert('请先保存数据到云端');
          return;
        }
        document.getElementById('download-options').style.display = 'block';
      }

      // 隐藏下载选项
      function hideDownloadOptions() {
        document.getElementById('download-options').style.display = 'none';
      }

      // 下载文件
      function downloadFiles() {
        if (!currentSaveDir) {
          alert('没有可下载的数据');
          return;
        }

        const baseUrl = `${API}/download/${currentSaveDir.split('/').pop()}`;
        
        if (selectedPlatform === 'browser') {
          // 浏览器直接下载模式 - 显示文件列表
          showFileList(baseUrl);
        } else {
          // 打包下载模式
          downloadAsZip(baseUrl);
        }
      }

      // 显示文件列表供选择下载
      function showFileList(baseUrl) {
        const fileList = `
          <div style="text-align: left; margin: 15px 0;">
            <strong>选择要下载的文件：</strong><br><br>
            <a href="${baseUrl}/" target="_blank" style="display: block; padding: 8px; background: #e3f2fd; margin: 5px 0; border-radius: 4px; text-decoration: none; color: #1976d2;">
              📁 查看所有文件（文件管理器）
            </a>
            <a href="${baseUrl}/" download style="display: block; padding: 8px; background: #f3e5f5; margin: 5px 0; border-radius: 4px; text-decoration: none; color: #7b1fa2;">
              📦 下载完整ZIP包
            </a>
            <div style="font-size: 0.9em; color: #666; margin-top: 10px;">
              提示：右键链接选择"另存为"可指定保存位置
            </div>
          </div>
        `;
        
        document.getElementById('download-instructions').innerHTML = fileList;
      }

      // 打包下载
      function downloadAsZip(baseUrl) {
        // 创建下载链接
        const downloadLink = document.createElement('a');
        downloadLink.href = baseUrl + '/?download=zip';
        downloadLink.download = `cityveins_report_${new Date().getTime()}.zip`;
        downloadLink.style.display = 'none';
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        log('开始下载...\n文件将保存到浏览器的默认下载目录\n下载完成后请检查下载文件夹');
        
        // 根据不同平台给出提示
        setTimeout(() => {
          let message = '下载已开始！';
          switch(selectedPlatform) {
            case 'windows':
              message += ' 文件通常保存在"下载"文件夹中';
              break;
            case 'linux':
              message += ' 文件通常保存在 ~/Downloads/ 目录';
              break;
            case 'android':
              message += ' 请在文件管理器中查看下载内容';
              break;
          }
          alert(message);
        }, 1000);
      }

      async function queryName() {
        const name = document.getElementById('name').value.trim();
        if (!name) {
          alert('请输入住宅区名称');
          return;
        }
        
        log('查询中...');
        try {
          const res = await fetch(`${API}/query`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({method: 'name', name})
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          candidates = data.result || [];
          if (candidates.length === 0) throw new Error('无结果');
          if (candidates.length === 1) {
            selectCandidate(0);
          } else {
            showPicker(candidates);
          }
        } catch (e) {
          log('查询出错：' + e.message);
          console.error('查询错误详情:', e);
          lastResult = null;
          updateButtonStates();
        }
      }

      function showPicker(list) {
        const existingPicker = document.getElementById('picker');
        if (existingPicker) {
          existingPicker.remove();
        }

        const picker = document.createElement('div');
        picker.id = 'picker';
        picker.className = 'picker';
        picker.innerHTML = `<h3>找到多个住宅区，请选择：</h3>` +
          list.map((c, i) =>
            `<label><input type="radio" name="pick" value="${i}"> ${c.name} - ${c.address} (ID: ${c.id})</label>`
          ).join('') +
          `<div class="picker-buttons">
            <button class="picker-btn confirm-btn" onclick="confirmPick()">确定</button>
            <button class="picker-btn cancel-btn" onclick="cancelPick()">取消</button>
          </div>`;
        document.body.appendChild(picker);
      }

      function confirmPick() {
        const idx = document.querySelector('input[name="pick"]:checked');
        if (!idx) { 
          alert('请先选择一项'); 
          return; 
        }
        selectCandidate(parseInt(idx.value));
        document.getElementById('picker').remove();
      }

      function cancelPick() {
        document.getElementById('picker').remove();
        log('已取消选择');
        lastResult = null;
        updateButtonStates();
      }

      function selectCandidate(idx) {
        lastResult = { result: [candidates[idx]] };
        candidates = [];
        const selected = lastResult.result[0];
        log(`已选择：${selected.name}\n地址：${selected.address}\nID：${selected.id}\n坐标：${selected.longitude}, ${selected.latitude}`);
        updateButtonStates();
      }

      async function saveData() {
        if (!lastResult || !lastResult.result || lastResult.result.length === 0) {
          alert('请先完成查询并选择住宅区！');
          return;
        }
        
        const r = lastResult.result[0];
        
        const payload = {
          residential_id: String(r.id),
          name: String(r.name || r.id),
          address: String(r.address || ''),
          lng: r.longitude ? parseFloat(r.longitude) : null,
          lat: r.latitude ? parseFloat(r.latitude) : null,
          radius: 1200,
          threshold: 0.4,
          filter_poi: true
        };
        
        log('正在保存到云端（去重 POI + 评分 + 报告）...');
        try {
          const res = await fetch(`${API}/save`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
          });
          
          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || `HTTP ${res.status}`);
          }
          
          currentSaveDir = result.save_dir;
          log(`保存完成！\n云端目录：${result.save_dir}\n\n现在可以点击"下载到本地"按钮将数据下载到您的设备。`);
          
          if (result.html_url) {
            // 自动打开报告预览
            setTimeout(() => {
              if (confirm('是否在浏览器中预览评估报告？')) {
                window.open(`${API}${result.html_url}`, '_blank');
              }
            }, 1000);
          }
          
          updateButtonStates();
        } catch (e) {
          log('保存失败：' + e.message);
          console.error('详细错误:', e);
        }
      }

      function log(txt) {
        document.getElementById('log').textContent = txt;
      }

      // 按回车键查询
      document.getElementById('name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          queryName();
        }
      });

      // 初始化按钮状态
      updateButtonStates();
    </script>
  </body>
</html>

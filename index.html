<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城脉 - 城市生活圈分析平台</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        color: #333;
        line-height: 1.6;
        min-height: 100vh;
        padding: 15px;
      }
      
      .container {
        max-width: 900px;
        margin: 0 auto;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      
      header {
        background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        color: white;
        padding: 30px 20px;
        text-align: center;
      }
      
      h1 {
        font-size: 2.8rem;
        font-weight: 700;
        margin-bottom: 15px;
        letter-spacing: 1px;
      }
      
      .slogan {
        font-size: 1.2rem;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.7;
      }
      
      .slogan-line {
        display: block;
        margin-bottom: 8px;
      }
      
      .slogan-highlight {
        position: relative;
        display: inline-block;
        font-weight: bold;
      }
      
      .slogan-highlight.dudian::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #e74c3c, #f39c12);
        border-radius: 2px;
        transform: scaleX(0.9);
      }
      
      .slogan-highlight.qimai::after {
        content: '';
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, #2ecc71, #3498db);
        border-radius: 2px;
        transform: scaleX(0.9);
      }
      
      .main-content {
        padding: 30px 20px;
      }
      
      .search-section {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }
      
      .search-title {
        font-size: 1.3rem;
        margin-bottom: 15px;
        color: #2c3e50;
      }
      
      .search-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      
      #name {
        padding: 12px 15px;
        font-size: 1rem;
        border: 2px solid #ddd;
        border-radius: 8px;
        width: 100%;
        max-width: 400px;
        transition: all 0.3s;
      }
      
      #name:focus {
        border-color: #3498db;
        outline: none;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      }
      
      #query-btn {
        padding: 12px 25px;
        font-size: 1rem;
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
        max-width: 400px;
      }
      
      #query-btn:hover {
        background: linear-gradient(135deg, #2980b9 0%, #2471a3 100%);
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      
      .action-section {
        text-align: center;
        margin-bottom: 25px;
      }
      
      .action-buttons {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      
      .action-btn {
        padding: 14px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 300px;
      }
      
      .save-btn {
        background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        color: white;
      }
      
      .download-btn {
        background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        color: white;
      }
      
      .action-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }
      
      .action-btn:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      
      .download-options {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
        border: 1px solid #e9ecef;
      }
      
      .download-options h4 {
        margin-bottom: 12px;
        color: #2c3e50;
        text-align: center;
        font-size: 1.2rem;
      }
      
      .platform-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      
      .platform-btn {
        padding: 8px 15px;
        border: 2px solid #3498db;
        background: white;
        color: #3498db;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9rem;
        flex: 1;
        min-width: 120px;
        max-width: 150px;
      }
      
      .platform-btn.active {
        background: #3498db;
        color: white;
      }
      
      .platform-btn:hover {
        background: #3498db;
        color: white;
      }
      
      .download-instructions {
        background: white;
        padding: 12px;
        border-radius: 6px;
        border-left: 4px solid #3498db;
        margin-top: 12px;
        font-size: 0.85rem;
      }
      
      .results-section {
        margin-top: 25px;
      }
      
      .results-section h3 {
        margin-bottom: 12px;
        color: #2c3e50;
        font-size: 1.2rem;
      }
      
      #log {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #e9ecef;
        min-height: 150px;
        max-height: 350px;
        overflow-y: auto;
        white-space: pre-wrap;
        font-family: monospace;
        line-height: 1.5;
        font-size: 0.9rem;
      }
      
      .picker {
        background: #fff;
        border: 2px solid #3498db;
        border-radius: 12px;
        padding: 20px;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1000;
        width: 90%;
        max-width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      
      .picker h3 {
        margin-bottom: 15px;
        color: #2c3e50;
        text-align: center;
        font-size: 1.3rem;
      }
      
      .picker label {
        display: block;
        padding: 10px 12px;
        margin-bottom: 6px;
        border-radius: 6px;
        transition: background 0.2s;
        cursor: pointer;
        font-size: 0.95rem;
      }
      
      .picker label:hover {
        background: #f1f8ff;
      }
      
      .picker input[type="radio"] {
        margin-right: 8px;
      }
      
      .picker-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 15px;
      }
      
      .picker-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.95rem;
        transition: all 0.3s;
        flex: 1;
        max-width: 120px;
      }
      
      .confirm-btn {
        background: #3498db;
        color: white;
      }
      
      .cancel-btn {
        background: #e74c3c;
        color: white;
      }
      
      .picker-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      
      .file-list {
        text-align: left;
        margin: 12px 0;
      }
      
      .file-item {
        display: flex;
        flex-direction: column;
        padding: 10px 12px;
        margin: 6px 0;
        background: white;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
        transition: all 0.2s;
      }
      
      .file-item:hover {
        background: #f8f9fa;
        border-color: #3498db;
      }
      
      .file-info {
        flex: 1;
        margin-bottom: 8px;
      }
      
      .file-name {
        font-weight: 600;
        margin-bottom: 4px;
        font-size: 0.95rem;
      }
      
      .file-details {
        font-size: 0.8rem;
        color: #666;
      }
      
      .file-actions {
        display: flex;
        gap: 8px;
      }
      
      .download-file-btn {
        padding: 6px 12px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
        flex: 1;
      }
      
      .download-file-btn:hover {
        background: #2980b9;
        transform: translateY(-1px);
      }
      
      footer {
        text-align: center;
        padding: 15px;
        color: #7f8c8d;
        font-size: 0.85rem;
        border-top: 1px solid #eee;
      }
      
      /* 平板和桌面样式 */
      @media (min-width: 768px) {
        body {
          padding: 20px;
        }
        
        header {
          padding: 40px 30px;
        }
        
        h1 {
          font-size: 3.5rem;
        }
        
        .slogan {
          font-size: 1.3rem;
        }
        
        .main-content {
          padding: 40px 30px;
        }
        
        .search-box {
          flex-direction: row;
          justify-content: center;
        }
        
        #name {
          width: 70%;
          border-radius: 8px 0 0 8px;
          margin-bottom: 0;
        }
        
        #query-btn {
          width: auto;
          border-radius: 0 8px 8px 0;
        }
        
        .action-buttons {
          flex-direction: row;
          justify-content: center;
        }
        
        .action-btn {
          width: auto;
        }
        
        .file-item {
          flex-direction: row;
          align-items: center;
        }
        
        .file-info {
          margin-bottom: 0;
        }
        
        .file-actions {
          margin-left: 15px;
        }
        
        .download-file-btn {
          flex: none;
        }
        
        .platform-btn {
          flex: none;
        }
      }
      
      /* 大屏幕样式 */
      @media (min-width: 1024px) {
        .slogan {
          font-size: 1.4rem;
        }
        
        .search-title {
          font-size: 1.4rem;
        }
        
        #name {
          font-size: 1.1rem;
        }
        
        #query-btn {
          font-size: 1.1rem;
        }
        
        .action-btn {
          font-size: 1.1rem;
        }
      }
      
      /* 小屏幕手机样式 */
      @media (max-width: 480px) {
        h1 {
          font-size: 2.2rem;
        }
        
        .slogan {
          font-size: 1rem;
        }
        
        .search-title {
          font-size: 1.1rem;
        }
        
        .picker {
          padding: 15px;
        }
        
        .picker h3 {
          font-size: 1.2rem;
        }
        
        .picker label {
          font-size: 0.9rem;
          padding: 8px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>城脉</h1>
        <p class="slogan">
          <span class="slogan-line">打通城市一刻钟便民生活圈<span class="slogan-highlight dudian">堵点</span>，</span>
          <span class="slogan-line">畅通城市居民生活<span class="slogan-highlight qimai">气脉</span>。</span>
        </p>
      </header>
      
      <div class="main-content">
        <section class="search-section">
          <h2 class="search-title">查询住宅区信息</h2>
          <div class="search-box">
            <input id="name" type="text" placeholder="输入住宅区名称" />
            <button id="query-btn" onclick="queryName()">查询</button>
          </div>
        </section>
        
        <section class="action-section">
          <div class="action-buttons">
            <button id="save-btn" class="action-btn save-btn" onclick="saveData()" disabled>保存到云端</button>
            <button id="download-btn" class="action-btn download-btn" onclick="showDownloadOptions()" disabled>下载到本地</button>
          </div>
          
          <div id="download-options" class="download-options" style="display: none;">
            <h4>选择下载方式</h4>
            <div class="platform-buttons">
              <button class="platform-btn active" onclick="selectPlatform('windows')">Windows</button>
              <button class="platform-btn" onclick="selectPlatform('linux')">Linux/Mac</button>
              <button class="platform-btn" onclick="selectPlatform('android')">Android</button>
              <button class="platform-btn" onclick="selectPlatform('browser')">浏览器下载</button>
            </div>
            
            <div id="download-instructions" class="download-instructions">
              <strong>Windows 下载说明：</strong><br>
              1. 点击"开始下载"按钮<br>
              2. 浏览器会自动下载ZIP压缩包<br>
              3. 解压到任意文件夹即可查看报告<br>
              4. 或者右键链接选择"另存为"
            </div>
            
            <div style="text-align: center; margin-top: 15px;">
              <button class="action-btn save-btn" onclick="downloadFiles()">开始下载</button>
              <button class="action-btn" onclick="hideDownloadOptions()" style="background: #95a5a6; margin-left: 10px;">取消</button>
            </div>
          </div>
        </section>
        
        <section class="results-section">
          <h3>查询结果</h3>
          <pre id="log">请输入住宅区名称并点击查询按钮...</pre>
        </section>
      </div>
      
      <footer>
        <p>城脉 · 城市生活圈分析平台 © 2025</p>
      </footer>
    </div>

    <script>
      const API = 'http://47.112.146.115';
      let lastResult = null;
      let candidates = [];
      let currentSaveDir = '';
      let selectedPlatform = 'windows';
      let currentResidentialName = '';

      // 确保所有请求使用UTF-8编码
      const defaultHeaders = {
        'Content-Type': 'application/json; charset=utf-8',
        'Accept': 'application/json; charset=utf-8'
      };

      // 更新按钮状态
      function updateButtonStates() {
        const saveBtn = document.getElementById('save-btn');
        const downloadBtn = document.getElementById('download-btn');
        const hasResult = lastResult && lastResult.result;
        
        saveBtn.disabled = !hasResult;
        downloadBtn.disabled = !currentSaveDir;
      }

      // 选择平台
      function selectPlatform(platform) {
        selectedPlatform = platform;
        
        // 更新按钮状态
        document.querySelectorAll('.platform-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // 更新说明文字
        const instructions = document.getElementById('download-instructions');
        switch(platform) {
          case 'windows':
            instructions.innerHTML = `
              <strong>Windows 下载说明：</strong><br>
              1. 点击"开始下载"按钮<br>
              2. 浏览器会自动下载ZIP压缩包<br>
              3. 解压到任意文件夹即可查看报告<br>
              4. 或者右键链接选择"另存为"
            `;
            break;
          case 'linux':
            instructions.innerHTML = `
              <strong>Linux/Mac 下载说明：</strong><br>
              1. 点击"开始下载"获取ZIP文件<br>
              2. 使用命令解压: <code>unzip 文件名.zip</code><br>
              3. 或在桌面环境中双击解压<br>
              4. 使用浏览器打开HTML报告文件
            `;
            break;
          case 'android':
            instructions.innerHTML = `
              <strong>Android 下载说明：</strong><br>
              1. 点击"开始下载"按钮<br>
              2. 使用文件管理器应用打开下载目录<br>
              3. 安装ZArchiver等解压软件<br>
              4. 解压后使用浏览器打开HTML文件
            `;
            break;
          case 'browser':
            // 浏览器下载模式 - 显示文件列表
            showFileList();
            break;
        }
      }

      // 显示下载选项
      function showDownloadOptions() {
        if (!currentSaveDir) {
          alert('请先保存数据到云端');
          return;
        }
        document.getElementById('download-options').style.display = 'block';
      }

      // 隐藏下载选项
      function hideDownloadOptions() {
        document.getElementById('download-options').style.display = 'none';
      }

      // 显示文件列表
      async function showFileList() {
        if (!currentSaveDir) {
          alert('没有可下载的数据');
          return;
        }

        const subpath = currentSaveDir.split('/').pop();
        
        try {
          const res = await fetch(`${API}/files/${subpath}`);
          const data = await res.json();
          
          if (!res.ok) {
            throw new Error(data.error || `HTTP ${res.status}`);
          }
          
          const fileListHTML = `
            <div class="file-list">
              <strong>选择要下载的文件：</strong><br><br>
              ${data.files.map(file => `
                <div class="file-item">
                  <div class="file-info">
                    <div class="file-name">${file.display_name}</div>
                    <div class="file-details">
                      大小: ${formatFileSize(file.size)} | 修改时间: ${file.mtime}
                    </div>
                  </div>
                  <div class="file-actions">
                    <button class="download-file-btn" onclick="downloadSingleFile('${file.url}')">下载</button>
                  </div>
                </div>
              `).join('')}
              
              <div style="margin-top: 15px; text-align: center;">
                <button class="action-btn save-btn" onclick="downloadZip()" style="margin-right: 10px;">打包下载全部</button>
                <button class="action-btn" onclick="previewReport()" style="background: #e67e22;">预览报告</button>
              </div>
              
              <div style="font-size: 0.9em; color: #666; margin-top: 10px;">
                提示：点击"下载"按钮直接下载单个文件，或使用"打包下载全部"下载所有文件
              </div>
            </div>
          `;
          
          document.getElementById('download-instructions').innerHTML = fileListHTML;
        } catch (e) {
          console.error('获取文件列表失败:', e);
          document.getElementById('download-instructions').innerHTML = `
            <div style="text-align: center; color: #e74c3c;">
              获取文件列表失败: ${e.message}<br>
              请尝试其他下载方式
            </div>
          `;
        }
      }

      // 格式化文件大小
      function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
      }

      // 下载单个文件
      function downloadSingleFile(url) {
        const downloadLink = document.createElement('a');
        downloadLink.href = API + url;
        downloadLink.style.display = 'none';
        downloadLink.target = '_blank';
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }

      // 打包下载
      function downloadZip() {
        if (!currentSaveDir) {
          alert('没有可下载的数据');
          return;
        }

        const subpath = currentSaveDir.split('/').pop();
        const zipUrl = `${API}/download-zip/${subpath}`;
        
        const downloadLink = document.createElement('a');
        downloadLink.href = zipUrl;
        downloadLink.style.display = 'none';
        
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        
        log('开始下载ZIP压缩包...\n文件将保存到浏览器的默认下载目录');
        
        setTimeout(() => {
          alert('ZIP压缩包下载已开始！文件通常保存在"下载"文件夹中');
        }, 1000);
      }

      // 预览报告
      function previewReport() {
        if (!currentSaveDir) {
          alert('没有可预览的报告');
          return;
        }

        const subpath = currentSaveDir.split('/').pop();
        const reportUrl = `${API}/download/${subpath}/report_${subpath.split('_')[0]}.html?name=${encodeURIComponent(currentResidentialName)}`;
        
        window.open(reportUrl, '_blank');
      }

      // 下载文件
      function downloadFiles() {
        if (!currentSaveDir) {
          alert('没有可下载的数据');
          return;
        }

        if (selectedPlatform === 'browser') {
          // 浏览器下载模式已经在selectPlatform中处理
          return;
        } else {
          // 打包下载模式
          downloadZip();
        }
      }

      async function queryName() {
        const name = document.getElementById('name').value.trim();
        if (!name) {
          alert('请输入住宅区名称');
          return;
        }
        
        log('查询中...');
        try {
          const res = await fetch(`${API}/query`, {
            method: 'POST',
            headers: defaultHeaders,
            body: JSON.stringify({method: 'name', name})
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          candidates = data.result || [];
          if (candidates.length === 0) throw new Error('无结果');
          if (candidates.length === 1) {
            selectCandidate(0);
          } else {
            showPicker(candidates);
          }
        } catch (e) {
          log('查询出错：' + e.message);
          console.error('查询错误详情:', e);
          lastResult = null;
          updateButtonStates();
        }
      }

      function showPicker(list) {
        const existingPicker = document.getElementById('picker');
        if (existingPicker) {
          existingPicker.remove();
        }

        const picker = document.createElement('div');
        picker.id = 'picker';
        picker.className = 'picker';
        picker.innerHTML = `<h3>找到多个住宅区，请选择：</h3>` +
          list.map((c, i) =>
            `<label><input type="radio" name="pick" value="${i}"> ${c.name} - ${c.address} (ID: ${c.id})</label>`
          ).join('') +
          `<div class="picker-buttons">
            <button class="picker-btn confirm-btn" onclick="confirmPick()">确定</button>
            <button class="picker-btn cancel-btn" onclick="cancelPick()">取消</button>
          </div>`;
        document.body.appendChild(picker);
      }

      function confirmPick() {
        const idx = document.querySelector('input[name="pick"]:checked');
        if (!idx) { 
          alert('请先选择一项'); 
          return; 
        }
        selectCandidate(parseInt(idx.value));
        document.getElementById('picker').remove();
      }

      function cancelPick() {
        document.getElementById('picker').remove();
        log('已取消选择');
        lastResult = null;
        updateButtonStates();
      }

      function selectCandidate(idx) {
        lastResult = { result: [candidates[idx]] };
        candidates = [];
        const selected = lastResult.result[0];
        currentResidentialName = selected.name;
        log(`已选择：${selected.name}\n地址：${selected.address}\nID：${selected.id}\n坐标：${selected.longitude}, ${selected.latitude}`);
        updateButtonStates();
      }

      async function saveData() {
        if (!lastResult || !lastResult.result || lastResult.result.length === 0) {
          alert('请先完成查询并选择住宅区！');
          return;
        }
        
        const r = lastResult.result[0];
        
        const payload = {
          residential_id: String(r.id),
          name: String(r.name || r.id),
          address: String(r.address || ''),
          lng: r.longitude ? parseFloat(r.longitude) : null,
          lat: r.latitude ? parseFloat(r.latitude) : null,
          radius: 1200,
          threshold: 0.4,
          filter_poi: true
        };
        
        log('正在保存到云端（去重 POI + 评分 + 报告）...');
        try {
          const res = await fetch(`${API}/save`, {
            method: 'POST',
            headers: defaultHeaders,
            body: JSON.stringify(payload)
          });
          
          const result = await res.json();
          if (!res.ok) {
            throw new Error(result.error || `HTTP ${res.status}`);
          }
          
          currentSaveDir = result.save_dir;
          currentResidentialName = payload.name;
          
          log(`保存完成！\n云端目录：${result.save_dir}\n\n现在可以点击"下载到本地"按钮将数据下载到您的设备。`);
          
          if (result.html_url) {
            // 自动打开报告预览
            setTimeout(() => {
              if (confirm('是否在浏览器中预览评估报告？')) {
                previewReport();
              }
            }, 1000);
          }
          
          updateButtonStates();
        } catch (e) {
          log('保存失败：' + e.message);
          console.error('详细错误:', e);
        }
      }

      function log(txt) {
        document.getElementById('log').textContent = txt;
      }

      // 按回车键查询
      document.getElementById('name').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          queryName();
        }
      });

      // 初始化按钮状态
      updateButtonStates();

      // 页面加载时确保编码正确
      document.addEventListener('DOMContentLoaded', function() {
        // 设置文档编码
        document.documentElement.lang = 'zh-CN';
        document.documentElement.charset = 'UTF-8';
      });
    </script>
  </body>
</html>
